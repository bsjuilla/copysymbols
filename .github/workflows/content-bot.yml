name: Content Bot — Daily Symbol & Kaomoji Generator

on:
  schedule:
    - cron: '0 7 * * *'   # 7am UTC  → Symbols run
    - cron: '0 13 * * *'  # 1pm UTC  → Kaomoji run
    - cron: '0 19 * * *'  # 7pm UTC  → Evening misc run
  workflow_dispatch:

jobs:
  generate-content:
    name: Generate new symbols & kaomoji
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run content bot
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/content-bot.mjs

      - name: Commit and push new content
        run: |
          git config --local user.email "content-bot@copychars.com"
          git config --local user.name "CopyChars Bot"
          git add src/data/generated-symbols.ts src/data/generated-kaomoji.ts
          if git diff --staged --quiet; then
            echo "No new content this run."
          else
            git commit -m "bot: auto-generate content [$(date +'%Y-%m-%d %H:%M UTC')]"
            git push
          fi
