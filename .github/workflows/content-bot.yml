name: Content Bot — Weekly PR Preview

# Generates new symbols/kaomoji once a week and opens a PR for human review
# instead of auto-pushing to main. The bot now classifies every candidate
# before insertion (scripts/classifiers.mjs) so most nonsense is filtered out,
# but the PR step is a safety net for anything the classifier misses.
#
# To revert to the old 3x-daily auto-push behaviour, restore the schedule
# block from git history at commit 78704e9 and remove the create-pull-request step.

on:
  schedule:
    - cron: '0 9 * * 1'   # Monday 9am UTC
  workflow_dispatch:        # Manual trigger always available

jobs:
  generate-content:
    name: Generate new symbols & kaomoji + open PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run content bot
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/content-bot.mjs

      - name: Run cleanup audit on bot output
        # Belt-and-braces: re-run the classifier-based cleanup against any new
        # entries the bot just added. If the classifier rejects anything,
        # cleanup-data.mjs moves it to _quarantine.json and the PR diff will
        # show what was caught.
        run: node scripts/cleanup-data.mjs || true

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet src/data/ _generator-state.json _quarantine.json; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No new content this run."
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            git diff --stat src/data/ _generator-state.json _quarantine.json
          fi

      - name: Open pull request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: bot/weekly-content-${{ github.run_number }}
          base: main
          delete-branch: true
          commit-message: "bot: weekly content generation [${{ github.run_id }}]"
          title: "bot: weekly content additions — ${{ github.event.repository.updated_at }}"
          body: |
            Automated weekly content-bot run.

            **What's in this PR:**
            - New symbols/kaomoji generated by `scripts/content-bot.mjs`
            - Items that failed classification have already been quarantined to `_quarantine.json` (will not appear in the data files)
            - Saturation state in `_generator-state.json` reflects this run

            **Review checklist before merging:**
            - [ ] Skim `src/data/generated-symbols.ts` and `src/data/generated-kaomoji.ts` diffs — anything obviously wrong?
            - [ ] Check `_quarantine.json` for items that would have shipped but were caught by the classifier
            - [ ] Confirm `npm run build` is green in the PR's status checks

            **Merging directly to main is fine** — the classifier is the first gate and you are the second. If you spot something wrong, close this PR and add the offending pattern to the classifier whitelist or `cleanup-data.mjs` rules.

            Run details: workflow `${{ github.workflow }}` run `${{ github.run_id }}`.
          labels: |
            bot
            content
            weekly
